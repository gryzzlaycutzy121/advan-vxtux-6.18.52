name: p1-build

# Build Image 6.18.52 dengan CONFIG_CMDLINE P1 (panic=0, tanpa initcall_debug),
# lalu COMMIT hasil + diagnostik kembali ke branch ini (artefak Actions tidak
# bisa diunduh tanpa token admin).
#
# Dirancang SELF-DIAGNOSING: log Actions butuh hak admin, jadi setiap langkah
# menulis ke p1/out/diag.txt dan langkah terakhir SELALU commit file itu.

on:
  push:
    branches: [p1-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc flex bison libssl-dev libelf-dev python3

      - name: Perbaiki exec bit skrip kernel
        run: |
          set -euo pipefail
          cd 6.18.52-VXTux-UMS512
          grep -rlI '^#!' scripts | xargs -r chmod +x
          chmod +x scripts/config scripts/mkcompile_h
          ls -l scripts/config scripts/mkcompile_h | awk '{print $1, $9}'

      - name: Config P1 (best effort, direkam)
        id: cfg
        continue-on-error: true
        working-directory: 6.18.52-VXTux-UMS512
        run: |
          set -x
          mkdir -p ../p1/out
          D=../p1/out/diag.txt
          : > "$D"
          echo "=== sebelum ===" >> "$D"
          grep -n '^CONFIG_CMDLINE' .config >> "$D" 2>&1 || true
          python3 - <<'PY' >> "$D" 2>&1
          import re
          cmd = open('../p1/p1-cmdline.txt').read().strip()
          s = open('.config').read()
          s2, n = re.subn(r'^CONFIG_CMDLINE=.*$', 'CONFIG_CMDLINE="%s"' % cmd,
                          s, count=1, flags=re.M)
          print("ganti CONFIG_CMDLINE:", n)
          s = s2
          s = re.sub(r'^CONFIG_CMDLINE_FORCE=.*$', 'CONFIG_CMDLINE_FORCE=y', s, count=1, flags=re.M)
          s = re.sub(r'^CONFIG_CMDLINE_(EXTEND|FROM_BOOTLOADER)=y$',
                     r'# CONFIG_CMDLINE_\1 is not set', s, flags=re.M)
          if not re.search(r'^CONFIG_CMDLINE_FORCE=y$', s, flags=re.M):
              s = re.sub(r'^(CONFIG_CMDLINE=".*")$', r'\1\nCONFIG_CMDLINE_FORCE=y',
                         s, count=1, flags=re.M)
          for opt in ('CONFIG_PSTORE', 'CONFIG_PSTORE_RAM', 'CONFIG_PSTORE_CONSOLE',
                      'CONFIG_PSTORE_PMSG'):
              if re.search(r'^# %s is not set$' % opt, s, flags=re.M):
                  s = re.sub(r'^# %s is not set$' % opt, opt + '=y', s, flags=re.M)
          open('.config', 'w').write(s)
          PY
          echo "=== sesudah edit ===" >> "$D"
          grep -n '^CONFIG_CMDLINE' .config >> "$D" 2>&1 || true
          echo "=== olddefconfig ===" >> "$D"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig >> "$D" 2>&1
          echo "olddefconfig rc=$?" >> "$D"
          echo "=== sesudah olddefconfig ===" >> "$D"
          grep -n '^CONFIG_CMDLINE' .config >> "$D" 2>&1 || true
          sed -n 's/^CONFIG_CMDLINE="\(.*\)"$/\1/p' .config > .cmdline.effective
          cat .cmdline.effective >> "$D"
          grep -q 'panic=0' .cmdline.effective
          echo "OK: cmdline P1 efektif"

      - name: Build Image (best effort, direkam)
        id: build
        continue-on-error: true
        working-directory: 6.18.52-VXTux-UMS512
        run: |
          set -x
          D=../p1/out/diag.txt
          echo "=== build ===" >> "$D"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image >> "$D" 2>&1
          rc=$?
          echo "build rc=$rc" >> "$D"
          ls -l arch/arm64/boot/Image >> "$D" 2>&1 || true
          exit $rc

      - name: Verifikasi cmdline tertanam
        if: steps.build.outcome == 'success'
        working-directory: 6.18.52-VXTux-UMS512
        run: |
          set -euo pipefail
          D=../p1/out/diag.txt
          strings arch/arm64/boot/Image | grep -m1 "earlycon console=tty0" | tee -a "$D"
          strings arch/arm64/boot/Image | grep -q 'panic=15'
          strings arch/arm64/boot/Image | grep -q 'hardlockup_panic=1'
          if strings arch/arm64/boot/Image | grep -q 'initcall_debug=1'; then
            echo "FATAL: initcall_debug masih tertanam" | tee -a "$D"; exit 1
          fi
          echo "cmdline P1 terbukti tertanam" | tee -a "$D"

      - name: Paketkan hasil
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p p1/out
          IMG=6.18.52-VXTux-UMS512/arch/arm64/boot/Image
          gzip -9 -c "$IMG" > p1/out/Image.gz
          ( cd p1/out && sha256sum Image.gz > Image.sha256 )
          {
            echo "kernelrelease: $(make -s -C 6.18.52-VXTux-UMS512 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)"
            echo "image_raw_size: $(stat -c%s "$IMG")"
            echo "image_gz_size: $(stat -c%s p1/out/Image.gz)"
            echo "compiler: $(aarch64-linux-gnu-gcc --version | head -1)"
            echo "cmdline: $(tr -d '\r\n' < p1/p1-cmdline.txt)"
            echo "commit: ${GITHUB_SHA}"
          } | tee p1/out/build-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-output
          path: p1/out/
          if-no-files-found: warn

      - name: Commit diagnostik + hasil (selalu)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "p1-build"
          git config user.email "p1-build@users.noreply.github.com"
          mkdir -p p1/out
          echo "config_step: ${{ steps.cfg.outcome }}" > p1/out/status.txt
          echo "build_step: ${{ steps.build.outcome }}" >> p1/out/status.txt
          echo "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> p1/out/status.txt
          git add -f p1/out/status.txt p1/out/diag.txt 2>/dev/null || true
          [ -f p1/out/Image.gz ] && git add -f p1/out/Image.gz p1/out/Image.sha256 p1/out/build-report.txt || true
          git commit -m "p1-build: hasil (${{ steps.build.outcome }}) [skip ci]" || echo "tidak ada perubahan"
          git push origin HEAD:p1-build
