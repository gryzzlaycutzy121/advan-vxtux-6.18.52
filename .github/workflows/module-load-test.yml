name: Module Load Test (QEMU)
on:
  workflow_dispatch:
  push:
    branches: [module-load-maximize]
jobs:
  modtest:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu flex bison bc \
            libssl-dev libelf-dev qemu-system-arm cpio kmod device-tree-compiler

      - name: Config (device + enhanced + fragmen QEMU)
        run: |
          cd 6.18.52-VXTux-UMS512
          find scripts/ -type f -exec chmod +x {} +
          cp .config .config.device
          sed -i 's/\r$//' .config.device ../enhanced_config.cfg arch/arm64/configs/vxtux_618_qemu.defconfig
          scripts/kconfig/merge_config.sh -m -O . .config.device \
            ../enhanced_config.cfg arch/arm64/configs/vxtux_618_qemu.defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          rc=0
          for s in CONFIG_VIRTIO=y CONFIG_VIRTIO_PCI=y CONFIG_VIRTIO_CONSOLE=y \
                   CONFIG_BLK_DEV_INITRD=y CONFIG_RD_GZIP=y CONFIG_BINFMT_SCRIPT=y \
                   CONFIG_DEVTMPFS=y CONFIG_ARCH_SPRD=y CONFIG_ARM_GIC_V3=y; do
            if ! grep -qx "$s" .config; then
              echo "::error::HILANG setelah olddefconfig: $s"
              rc=1
            fi
          done
          exit $rc

      - name: Build Image
        run: |
          cd           6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          ls -l arch/arm64/boot/Image

      - name: Build TF-A BL31 (EL3 untuk QEMU -> SMC_UNK)
        run: |
          set -e
          # TF-A qemu default GICv2; QEMU kita pakai gic-version=3 -> paksa GICv3.
          # ARM_LINUX_KERNEL_AS_BL33=1: BL33 adalah kernel Linux (bl33.bin=Image),
          # FDT diedit BL2 (tambah PSCI) lalu diteruskan ke kernel via x0.
          git clone --depth 1 https://github.com/ARM-software/arm-trusted-firmware.git /tmp/tfa
          # lib/libfdt needs the dtc submodule (contrib/dtc); --depth clone skips
          # submodules, so fetch just that one (others unused by PLAT=qemu).
          git -C /tmp/tfa submodule update --init --depth 1 contrib/dtc
          make -C /tmp/tfa CROSS_COMPILE=aarch64-linux-gnu- \
            PLAT=qemu QEMU_USE_GIC_DRIVER=QEMU_GICV3 ARM_LINUX_KERNEL_AS_BL33=1 \
            -j$(nproc) bl1 bl2 bl31
          ls -l /tmp/tfa/build/qemu/release/bl1.bin \
                /tmp/tfa/build/qemu/release/bl2.bin \
                /tmp/tfa/build/qemu/release/bl31.bin

      - name: Build modules
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules -j$(nproc)
          find . -name '*.ko' | sed 's#^\./##' | sort > /tmp/modules.list
          wc -l /tmp/modules.list | tee /tmp/ko_count.txt
          echo "--- ORI parity (236) present in build? ---"
          # WCN core/integ/platform/sipc/wlan sengaja BUILT-IN (=y): tidak muncul
          # sebagai .ko. Jangan dihitung GAP; verifikasi lewat System.map.
          BUILTIN_MODULES=(
            "drivers/vxtux/net/wireless/sprdwcn/platform/wcn_core.ko"
            "drivers/vxtux/net/wireless/sprdwcn/boot/wcn_integrate.ko"
            "drivers/vxtux/net/wireless/sprdwcn/boot/wcn_integrate_boot.ko"
            "drivers/vxtux/net/wireless/sprdwcn/boot/wcn_integrate_dev.ko"
            "drivers/vxtux/net/wireless/sprdwcn/sipc/wcn_sipc.ko"
            "drivers/vxtux/net/wireless/sprdwcn/wlan/sprdwl.ko"
          )
          miss=0; builtin=0
          while read -r m; do
            if [ ! -f "$m" ]; then
              if printf '%s\n' "${BUILTIN_MODULES[@]}" | grep -qxF "$m"; then
                echo "BUILT-IN(by design): $m"; builtin=$((builtin+1))
              else
                echo "GAP: $m"; miss=$((miss+1))
              fi
            fi
          done < ../module_load_manifest.txt
          echo "ori_gap=$miss builtin_by_design=$builtin"
          echo "--- verifikasi simbol WCN built-in di System.map ---"
          for s in wcn_init_core get_wcn_bus_ops marlin_init; do
            if grep -q " $s\$" System.map 2>/dev/null; then
              echo "BUILTIN-SYM ok: $s"
            else
              echo "::warning::simbol built-in tidak ditemukan: $s"
            fi
          done
          # Urutan dependensi: modpost menulis field "depends=" di .modinfo.
          # modinfo -F depends membacanya -> topological sort (deps lebih dulu).
          cp /tmp/modules.list /tmp/modules.alphabetic.list
          python3 - <<'EOFPY'
          import os, subprocess
          root = '6.18.52-VXTux-UMS512'
          built = [l.strip() for l in open('/tmp/modules.alphabetic.list') if l.strip()]
          bset = set(built)
          # peta nama modul (basename tanpa .ko) -> path, untuk resolusi depends
          name2path = {}
          for m in built:
              base = os.path.basename(m)[:-3]
              name2path[base] = m
          deps = {}
          for m in built:
              p = os.path.join(root, m)
              try:
                  out = subprocess.run(['modinfo','-F','depends',p],
                                       capture_output=True, text=True,
                                       timeout=30).stdout
              except Exception:
                  out = ''
              dl = []
              for d in out.split(','):
                  d = d.strip()
                  if not d:
                      continue
                  if d.endswith('.ko'):
                      d = d[:-3]
                  d = os.path.basename(d)
                  if d in name2path:
                      dl.append(name2path[d])
              deps[m] = dl
          order, seen, temp = [], set(), set()
          def visit(n):
              if n in seen or n in temp:
                  return
              temp.add(n)
              for d in deps.get(n, []):
                  visit(d)
              temp.discard(n)
              seen.add(n)
              order.append(n)
          for n in built:
              visit(n)
          with open('/tmp/modules.list','w') as f:
              f.write('\n'.join(order) + '\n')
          print('urutan dependensi: %d modul (dengan %d relasi deps)' %
                (len(order), sum(len(v) for v in deps.values())))
          EOFPY
          wc -l /tmp/modules.list

      - name: Initramfs (modtest_init + modules + manifest)
        run: |
          set -e
          aarch64-linux-gnu-gcc -static -O2 -march=armv8-a -mabi=lp64 \
            -o /tmp/modtest_init modtest_init.c
          file /tmp/modtest_init | tee /tmp/modtest-init-arch.txt
          file /tmp/modtest_init | grep -q 'ARM aarch64' || \
            { echo "::error::modtest_init bukan aarch64"; exit 1; }
          rm -rf /tmp/initramfs
          mkdir -p /tmp/initramfs/proc /tmp/initramfs/sys /tmp/initramfs/dev /tmp/initramfs/modules
          cp /tmp/modtest_init /tmp/initramfs/init
          chmod 755 /tmp/initramfs/init
          cp /tmp/modules.list /tmp/initramfs/module_load_manifest.txt
          cd 6.18.52-VXTux-UMS512
          while read -r m; do
            if [ -f "$m" ]; then
              mkdir -p "/tmp/initramfs/modules/$(dirname "$m")"
              cp "$m" "/tmp/initramfs/modules/$m"
            fi
          done < /tmp/modules.list
          echo "ko in initramfs: $(find /tmp/initramfs/modules -name '*.ko' | wc -l)"
          (cd /tmp/initramfs && find . | cpio -o -H newc --owner root:root | gzip -9) > /tmp/initramfs.cpio.gz
          ls -lh /tmp/initramfs.cpio.gz
          gzip -t /tmp/initramfs.cpio.gz
          # artefak untuk iterasi lokal (download Image + modul + initramfs)
          cp arch/arm64/boot/Image /tmp/Image
          tar -czf /tmp/built_kos.tar.gz -C /tmp/initramfs modules

      - name: Embed initramfs into Image (Linux-as-BL33 ignores QEMU -initrd)
        run: |
          set -e
          cd 6.18.52-VXTux-UMS512
          # ARM_LINUX_KERNEL_AS_BL33=1: BL33 is the kernel loaded from bl33.bin
          # via semihosting. QEMU only places -kernel/-initrd into fw_cfg (read
          # by EDK2, not by a bare Linux BL33), so bake the cpio into the Image.
          ./scripts/config --file .config \
            --set-str INITRAMFS_SOURCE "/tmp/initramfs.cpio.gz"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image -j$(nproc)
          ls -l arch/arm64/boot/Image
          cp arch/arm64/boot/Image /tmp/Image

      - name: Boot QEMU (TF-A BL31 + module load test)
        run: |
          set +e
          # Direktori kerja semihosting: BL1 (dari -bios) memuat BL2/BL31/BL33
          # lewat semihosting relatif terhadap cwd. BL33 = kernel (ARM_LINUX_
          # KERNEL_AS_BL33=1), jadi bl33.bin -> Image.
          rm -rf /tmp/qemu-tfa && mkdir -p /tmp/qemu-tfa
          TFADIR=/tmp/tfa/build/qemu/release
          cp "$TFADIR/bl1.bin" "$TFADIR/bl2.bin" "$TFADIR/bl31.bin" /tmp/qemu-tfa/
          cp 6.18.52-VXTux-UMS512/arch/arm64/boot/Image /tmp/qemu-tfa/Image
          ln -sf Image /tmp/qemu-tfa/bl33.bin
          ls -l /tmp/qemu-tfa
          cd /tmp/qemu-tfa
          timeout --signal=KILL 300 qemu-system-aarch64 \
            -machine virt,gic-version=3,highmem=off,secure=on \
            -cpu cortex-a72 -smp 8 -m 2G \
            -bios bl1.bin \
            -kernel Image \
            -semihosting-config enable=on,target=native \
            -append "console=ttyAMA0 console=hvc0 rdinit=/init panic=-1 oops=panic loglevel=6" \
            -serial file:/tmp/tfa-pl011.log \
            -device virtio-serial-pci \
            -device virtconsole,chardev=vc0 \
            -chardev stdio,id=vc0,signal=off,logfile=/tmp/serial-modtest.log \
            -display none -monitor none -no-reboot \
            -d guest_errors,unimp,cpu_reset -D /tmp/qemu-modtest.debug.log \
            > /tmp/qemu-modtest-stdout.log 2>&1
          echo "qemu exit=$?"
          echo "serial bytes: $(wc -c < /tmp/serial-modtest.log 2>/dev/null)"
          echo "tfa/pl011 bytes: $(wc -c < /tmp/tfa-pl011.log 2>/dev/null)"
          echo "--- tail tfa/pl011 (TF-A + early kernel) ---"
          tail -n 30 /tmp/tfa-pl011.log 2>/dev/null
          echo "--- tail serial (hvc0) ---"
          tail -n 40 /tmp/serial-modtest.log 2>/dev/null
          ok=0
          grep -q 'VXTUX-MODTEST-PASS' /tmp/serial-modtest.log && ok=1
          echo "marker pass=$ok"
          grep -E 'SUMMARY|LOAD FAIL|FATAL|Kernel panic' /tmp/serial-modtest.log | tail -n 60
          if [ "$ok" = 1 ]; then
            echo "MODULE LOAD TEST PASS"
            exit 0
          fi
          echo '::error::module load test belum pass lihat log di atas'
          echo '--- qemu debug tail ---'; tail -n 20 /tmp/qemu-modtest.debug.log 2>/dev/null
          echo '--- tfa/pl011 tail ---'; tail -n 40 /tmp/tfa-pl011.log 2>/dev/null
          exit 1

      - name: Upload serial log + Image + modul (untuk iterasi lokal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modtest-artifacts
          path: |
            /tmp/serial-modtest.log
            /tmp/tfa-pl011.log
            /tmp/qemu-modtest-stdout.log
            /tmp/qemu-modtest.debug.log
            /tmp/modtest-init-arch.txt
            /tmp/ko_count.txt
            /tmp/Image
            /tmp/built_kos.tar.gz
            /tmp/tfa/build/qemu/release/bl1.bin
            /tmp/tfa/build/qemu/release/bl2.bin
            /tmp/tfa/build/qemu/release/bl31.bin
            /tmp/initramfs.cpio.gz
            /tmp/modules.list
          if-no-files-found: warn
